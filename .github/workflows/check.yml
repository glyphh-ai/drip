# Every pull request and every push to main: each game and drip folder is
# checked with the plugin's own rules, and on a pull request each folder it
# touches must be its opener's (scripts/authors.js). On main, index.json is rewritten and
# committed when it changed. The plugin (plugins/drip) runs its tests and is
# validated, with the marketplace, by Claude Code on a Mac.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.js --all
      - if: github.event_name == 'pull_request'
        run: node scripts/authors.js "${{ github.event.pull_request.user.login }}" "origin/${{ github.base_ref }}"
      - if: github.event_name == 'push'
        run: |
          node scripts/index.js
          if ! git diff --quiet index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "index.json: $(git rev-parse --short HEAD)"
            git push
          fi
  plugin:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin test plugins/drip
      - run: claude plugin validate plugins/drip
      - run: claude plugin validate .
