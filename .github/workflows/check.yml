# Every pull request and every push to main: each game and drip folder is
# checked with the plugin's own rules. On main, index.json is rewritten and
# committed when it changed.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.js --all
      - if: github.event_name == 'push'
        run: |
          node scripts/index.js
          if ! git diff --quiet index.json; then
            git config user.name "glyphh-drip-bot"
            git config user.email "bot@glyphh.ai"
            git add index.json
            git commit -m "index.json: $(git rev-parse --short HEAD)"
            git push
          fi
