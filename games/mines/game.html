<!doctype html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:rgba(0,0,0,0);user-select:none;-webkit-user-select:none}
canvas{position:absolute;left:0;top:0;display:block}
</style></head><body>
<canvas id="c"></canvas>
<script>
// Mines: click (or arrows and space) to open a cell, right-click or F to flag
// one; the numbers count the mines around them. A point a safe cell, a bonus
// for a cleared board, and each board is bigger and holds more mines.
(function(){
var W=drip.width,H=drip.height,BEST=drip.best,sfx=drip.sfx,ENDMS=2500;
var cv=document.getElementById("c"),c=cv.getContext("2d");cv.width=W;cv.height=H;
var PH=Math.floor(H*0.94),U=PH/600,HEAD=Math.round(66*U),FOOT=Math.round(24*U),PAD=Math.round(12*U);
var NUMCOL=["","#60a5fa","#4ade80","#f87171","#c084fc","#fb923c","#2dd4bf","#f472b6","#e5e7eb"];
var level,cols,rows,mines,cells,cell,PW,PX,PY,BX,BY,state="title",cur,placed,opened,flags,score=0,t0,elapsed,paused=false,dead=false,deadAt=0,endAt=0,clearAt=-1e9,bonus=0,shake=0,beat=false,beatAt=-1e9,closed=false,hover=null,parts=[];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function rnd(a,b){return a+Math.random()*(b-a)}
function setup(L){level=L;cols=Math.min(30,9+2*L);rows=Math.min(16,9+L);mines=Math.round(cols*rows*Math.min(0.21,0.123+0.012*L));
  cell=Math.floor(Math.min((W*0.96-PAD*2)/cols,(PH-HEAD-FOOT-PAD*2)/rows));PW=cols*cell+PAD*2;PX=Math.floor((W-PW)/2);PY=Math.floor((H-PH)/2);BX=PX+PAD;BY=PY+HEAD+PAD;
  cells=[];for(var i=0;i<cols*rows;i++)cells.push({mine:false,open:false,flag:false,n:0,hit:false});
  cur={r:Math.floor(rows/2),c:Math.floor(cols/2)};placed=false;opened=0;flags=0;t0=0;elapsed=0}
setup(0);
function at(r,q){return r<0||q<0||r>=rows||q>=cols?null:cells[r*cols+q]}
function around(r,q,f){for(var dr=-1;dr<=1;dr++)for(var dq=-1;dq<=1;dq++)if(dr||dq){var x=at(r+dr,q+dq);if(x)f(x,r+dr,q+dq)}}
function place(r,q){var spots=[];for(var i=0;i<rows;i++)for(var j=0;j<cols;j++)if(Math.abs(i-r)>1||Math.abs(j-q)>1)spots.push(i*cols+j);
  for(var m=0;m<mines&&spots.length;m++){var k=Math.floor(Math.random()*spots.length);cells[spots[k]].mine=true;spots.splice(k,1)}
  for(i=0;i<rows;i++)for(j=0;j<cols;j++){var n=0;around(i,j,function(x){if(x.mine)n++});cells[i*cols+j].n=n}placed=true;t0=performance.now()}
function burst(x,y,n,cols_,speed){for(var i=0;i<n;i++){var a=rnd(0,Math.PI*2),v=rnd(0.3,1)*speed;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-speed*0.3,life:rnd(0.5,1),max:1,s:rnd(2,6)*U,col:cols_[i%cols_.length]})}}
function boom(r,q){dead=true;deadAt=performance.now();at(r,q).hit=true;shake=10*U;
  for(var i=0;i<cells.length;i++)if(cells[i].mine)cells[i].open=true;
  burst(BX+q*cell+cell/2,BY+r*cell+cell/2,40,["#f472b6","#fb923c","#fff","#fde68a"],300*U);sfx.noise(0.7,0.6,1800,70);sfx.tone(160,0.7,"sawtooth",0.14,40)}
function reveal(r,q){var x=at(r,q);if(!x||x.open||x.flag)return 0;x.open=true;
  if(x.mine){boom(r,q);return 0}var n=1;opened++;if(x.n===0)around(r,q,function(y,i,j){n+=reveal(i,j)});return n}
function gain(n,now){if(!n)return;score+=n;drip.score(score);if(BEST>0&&!beat&&score>BEST){beat=true;beatAt=now;sfx.notes([[784,0.08,0],[988,0.08,0.08],[1319,0.24,0.16]],"triangle",0.1)}}
function open(r,q){if(state!=="play"||paused||dead||state==="clear")return;var x=at(r,q);if(!x)return;var now=performance.now();
  if(x.open){ // chord: the flags around it count, open the rest
    var f=0;around(r,q,function(y){if(y.flag)f++});if(f!==x.n)return;var n=0;around(r,q,function(y,i,j){if(!y.flag&&!y.open)n+=reveal(i,j)});
    if(n&&!dead){sfx.tone(520,0.05,"square",0.05,700);gain(n,now)}check(now);return}
  if(x.flag)return;if(!placed)place(r,q);
  var got=reveal(r,q);if(dead)return;
  if(got>1)sfx.notes([[520,0.05,0],[660,0.05,0.05],[780,0.08,0.1]],"square",0.05);else sfx.tone(600,0.04,"square",0.04);
  gain(got,now);check(now)}
function flag(r,q){if(state!=="play"||paused||dead)return;var x=at(r,q);if(!x||x.open)return;x.flag=!x.flag;flags+=x.flag?1:-1;sfx.tone(x.flag?880:660,0.05,"triangle",0.06)}
function check(now){if(opened<cols*rows-mines)return;state="clear";clearAt=now;var secs=Math.floor(elapsed/1000);bonus=mines*10+Math.max(0,300-secs);gain(bonus,now);
  sfx.notes([[523,0.1,0],[659,0.1,0.1],[784,0.1,0.2],[1047,0.3,0.3]],"triangle",0.1);
  for(var i=0;i<12;i++)burst(BX+Math.random()*cols*cell,BY+Math.random()*rows*cell,6,["#f472b6","#c084fc","#fde68a","#fff"],200*U)}
function cellAt(x,y){var q=Math.floor((x-BX)/cell),r=Math.floor((y-BY)/cell);return r<0||q<0||r>=rows||q>=cols?null:{r:r,c:q}}
function start(){if(state==="title")state="play"}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"||e.key==="m"||e.key==="M")return;
  if(state==="title"){if(!e.repeat)start();return}
  var k=e.key;
  if(k==="ArrowUp"||k==="w"||k==="W"){e.preventDefault();cur.r=Math.max(0,cur.r-1)}
  else if(k==="ArrowDown"||k==="s"||k==="S"){e.preventDefault();cur.r=Math.min(rows-1,cur.r+1)}
  else if(k==="ArrowLeft"||k==="a"||k==="A"){e.preventDefault();cur.c=Math.max(0,cur.c-1)}
  else if(k==="ArrowRight"||k==="d"||k==="D"){e.preventDefault();cur.c=Math.min(cols-1,cur.c+1)}
  else if(e.repeat)return;
  else if(k===" "||k==="Enter"){e.preventDefault();open(cur.r,cur.c)}
  else if(k==="f"||k==="F"){flag(cur.r,cur.c)}
  else if((k==="p"||k==="P")&&state==="play"&&!dead){paused=!paused;sfx.tone(paused?440:660,0.08,"triangle",0.06)}});
document.addEventListener("mousemove",function(e){var p=cellAt(e.clientX,e.clientY);hover=p;if(p&&state==="play"){cur.r=p.r;cur.c=p.c}});
document.addEventListener("mousedown",function(e){e.preventDefault();if(state==="title"){start();return}var p=cellAt(e.clientX,e.clientY);if(!p)return;
  if(e.button===2)flag(p.r,p.c);else if(e.button===0)open(p.r,p.c)});
document.addEventListener("contextmenu",function(e){e.preventDefault()});
function roundRect(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function text(str,x,y,size,col,align,weight){c.font=(weight||700)+" "+Math.round(size)+"px Menlo, Monaco, 'Courier New', monospace";c.textAlign=align||"center";c.textBaseline="middle";c.fillStyle=col;c.fillText(str,x,y)}
function drawMine(x,y,s,hit,col){c.fillStyle=hit?"#fff":(col||"#0f0a1e");c.lineWidth=Math.max(1,s*0.12);c.strokeStyle=c.fillStyle;
  for(var i=0;i<4;i++){var a=i*Math.PI/4;c.beginPath();c.moveTo(x-Math.cos(a)*s*0.42,y-Math.sin(a)*s*0.42);c.lineTo(x+Math.cos(a)*s*0.42,y+Math.sin(a)*s*0.42);c.stroke()}
  c.beginPath();c.arc(x,y,s*0.28,0,Math.PI*2);c.fill();c.fillStyle=hit?"#f472b6":"#c084fc";c.beginPath();c.arc(x-s*0.09,y-s*0.09,s*0.08,0,Math.PI*2);c.fill()}
function drawFlag(x,y,s){c.strokeStyle="#f8fafc";c.lineWidth=Math.max(1,s*0.08);c.beginPath();c.moveTo(x+s*0.08,y-s*0.3);c.lineTo(x+s*0.08,y+s*0.32);c.stroke();
  c.fillStyle="#f472b6";c.beginPath();c.moveTo(x+s*0.08,y-s*0.3);c.lineTo(x-s*0.28,y-s*0.1);c.lineTo(x+s*0.08,y+s*0.08);c.closePath();c.fill()}
function drawCell(r,q,now){var x=BX+q*cell,y=BY+r*cell,s=cell,z=at(r,q),e=Math.max(1,s*0.07);
  if(z.open){c.fillStyle=z.hit?"#be123c":"#1e1b4b";c.fillRect(x,y,s,s);c.strokeStyle="rgba(0,0,0,0.35)";c.lineWidth=1;c.strokeRect(x+0.5,y+0.5,s-1,s-1);
    if(z.mine)drawMine(x+s/2,y+s/2,s,z.hit);else if(z.n)text(String(z.n),x+s/2,y+s/2+s*0.04,s*0.6,NUMCOL[z.n],"center",800)}
  else{c.fillStyle="#6d28d9";c.fillRect(x,y,s,s);c.fillStyle="#a78bfa";c.fillRect(x,y,s,e);c.fillRect(x,y,e,s);c.fillStyle="#4c1d95";c.fillRect(x,y+s-e,s,e);c.fillRect(x+s-e,y,e,s);
    if(z.flag){if(dead&&!z.mine){drawFlag(x+s/2,y+s/2,s);c.strokeStyle="#fff";c.lineWidth=Math.max(1,s*0.1);c.beginPath();c.moveTo(x+s*0.25,y+s*0.25);c.lineTo(x+s*0.75,y+s*0.75);c.moveTo(x+s*0.75,y+s*0.25);c.lineTo(x+s*0.25,y+s*0.75);c.stroke()}else drawFlag(x+s/2,y+s/2,s)}}
  if(state==="play"&&!dead&&cur.r===r&&cur.c===q){c.strokeStyle="rgba(255,255,255,"+(0.6+0.3*Math.sin(now/200))+")";c.lineWidth=Math.max(2,s*0.1);c.strokeRect(x+1,y+1,s-2,s-2)}}
function drawHud(now){var s=Math.max(11,15*U),y=PY+HEAD*0.5;
  text("MINES",PX+PAD,PY+HEAD*0.38,s*1.6,"#f472b6","left",800);text("BOARD "+(level+1)+"  "+cols+"×"+rows,PX+PAD,PY+HEAD*0.76,s*0.7,"rgba(255,255,255,0.65)","left",700);
  var mx=PX+PW*0.42;drawMine(mx-s*2.2,y,s*1.3,false,"#e9d5ff");text(String(mines-flags),mx,y,s*1.5,"#fff","left",800);
  var secs=Math.floor(elapsed/1000);text((secs<600?("00"+Math.floor(secs/60)).slice(-2)+":"+("0"+secs%60).slice(-2):secs+"s"),PX+PW*0.62,y,s*1.3,"#c084fc","center",700);
  text(fmt(score),PX+PW-PAD,PY+HEAD*0.38,s*1.5,"#fff","right",800);text("BEST "+fmt(Math.max(BEST,score)),PX+PW-PAD,PY+HEAD*0.76,s*0.7,"#fde68a","right",700);
  text("CLICK OPENS · RIGHT-CLICK OR F FLAGS · P PAUSE · M MUTE · ESC QUIT",PX+PW/2,PY+PH-FOOT*0.5,Math.min(s*0.62,PW/58),"rgba(255,255,255,0.55)","center",700)}
function drawTitle(now){var s=Math.max(14,20*U),bw=cols*cell,bh=rows*cell;c.fillStyle="rgba(15,8,36,0.82)";c.fillRect(BX,BY,bw,bh);
  var y=BY+bh*0.3;text("MINES",PX+PW/2,y,s*3,"#f472b6","center",800);
  text("CLICK OPENS. RIGHT-CLICK OR F FLAGS.",PX+PW/2,y+s*2.5,Math.min(s*0.8,bw/26),"#fff","center",700);
  text("BEST "+fmt(BEST),PX+PW/2,y+s*3.9,s*1.1,"#fde68a","center",800);
  c.globalAlpha=0.6+0.4*Math.sin(now/300);text("PRESS ANY KEY",PX+PW/2,BY+bh*0.8,s*0.9,"#fff","center",800);c.globalAlpha=1}
function drawClear(now){var k=Math.min(1,(now-clearAt)/200),s=Math.max(14,20*U);c.save();c.globalAlpha=k;
  c.fillStyle="rgba(15,8,36,0.8)";roundRect(PX+PW*0.15,BY+rows*cell*0.35,PW*0.7,s*4.4,10*U);c.fill();
  text("BOARD CLEAR",PX+PW/2,BY+rows*cell*0.35+s*1.5,s*1.7,"#4ade80","center",800);text("+"+fmt(bonus)+" BONUS",PX+PW/2,BY+rows*cell*0.35+s*3.3,s*1,"#fde68a","center",700);c.restore()}
function drawEnd(now){var k=Math.min(1,(now-endAt)/250),s=Math.max(14,20*U),bw=Math.min(PW*0.86,s*22),bh=s*8,bx=PX+PW/2-bw/2,by=BY+rows*cell/2-bh/2;
  c.save();c.globalAlpha=k;c.fillStyle="rgba(15,8,36,0.94)";roundRect(bx,by,bw,bh,12*U);c.fill();c.strokeStyle="#f472b6";c.lineWidth=Math.max(2,3*U);c.stroke();
  text("GAME OVER",PX+PW/2,by+s*1.8,s*1.6,"#f472b6","center",800);text(fmt(score),PX+PW/2,by+s*4.2,s*2.4,"#fff","center",800);
  text(beat?"NEW BEST!":"BEST "+fmt(Math.max(BEST,score))+" · BOARD "+(level+1),PX+PW/2,by+s*6.4,s*0.9,"#fde68a","center",700);c.restore()}
window.__mines={cells:function(){return cells},size:function(){return{cols:cols,rows:rows,mines:mines,level:level}},open:open,flag:flag,state:function(){return state},score:function(){return score}};
var last=performance.now();
function frame(now){if(closed)return;var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state==="play"&&placed&&!paused&&!dead)elapsed+=dt*1000;
  if(state==="clear"&&now-clearAt>1500){setup(level+1);state="play"}
  if(dead&&state==="play"&&now-deadAt>900){state="end";endAt=now;drip.score(score);sfx.notes([[392,0.2,0],[330,0.2,0.2],[262,0.45,0.4]],"triangle",0.14)}
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;p.vy+=900*U*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)parts.splice(i,1)}
  c.clearRect(0,0,W,H);c.save();if(shake>0){c.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);shake=Math.max(0,shake-dt*40*U)}
  c.fillStyle="#17112e";roundRect(PX,PY,PW,PH,14*U);c.fill();c.strokeStyle="rgba(255,255,255,0.18)";c.lineWidth=2;c.stroke();
  c.fillStyle="#0f0a1e";c.fillRect(BX-2,BY-2,cols*cell+4,rows*cell+4);
  for(var r=0;r<rows;r++)for(var q=0;q<cols;q++)drawCell(r,q,now);
  for(i=0;i<parts.length;i++){p=parts[i];c.globalAlpha=Math.max(0,p.life/p.max);c.fillStyle=p.col;c.fillRect(p.x,p.y,p.s,p.s)}c.globalAlpha=1;
  drawHud(now);
  if(now-beatAt<1400){c.globalAlpha=Math.min(1,(1400-(now-beatAt))/300);text("NEW BEST!",PX+PW/2,BY+rows*cell*0.5,Math.max(20,36*U),"#fde68a","center",800);c.globalAlpha=1}
  if(paused){c.fillStyle="rgba(15,8,36,0.85)";c.fillRect(BX,BY,cols*cell,rows*cell);text("PAUSED",PX+PW/2,BY+rows*cell/2,Math.max(20,36*U),"#fff","center",800)}
  c.restore();
  if(state==="title")drawTitle(now);if(state==="clear")drawClear(now);
  if(state==="end"){drawEnd(now);if(now-endAt>=ENDMS){closed=true;c.clearRect(0,0,W,H);drip.end();return}}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
</body></html>
