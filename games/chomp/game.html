<!doctype html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;user-select:none;-webkit-user-select:none}
canvas{position:absolute;left:0;top:0}
</style></head><body>
<canvas id="c"></canvas>
<script>
// Chomp: a maze of dots and four spooks. Arrows (or WASD) steer the chomper;
// eat every dot to clear the maze, and a glowing pellet turns the spooks blue
// and edible for a moment. Every maze is drawn fresh, mirrored and loopy, and
// the spooks get faster and bolder with each one.
(function(){
var W=drip.width,H=drip.height,BEST=drip.best||0,ENDMS=2300,LIVES=3,EXTRA=10000;
var COLS=21,ROWS=23,CX=10,PEN={x0:8,x1:12,y0:10,y1:12},DOOR={x:10,y:9},HOME={x:10,y:11},START={x:10,y:17};
var c=document.getElementById("c");c.width=W;c.height=H;var g=c.getContext("2d");
var T=Math.max(10,Math.floor(Math.min((H-74)/ROWS,(W-24)/COLS))),OX=Math.round(W/2-COLS*T/2),OY=Math.round((H-ROWS*T)/2+8);
var GCOL=["#a78bfa","#fbbf24","#fb7185","#2dd4bf"],CORNERS=[{x:1,y:1},{x:19,y:1},{x:1,y:21},{x:19,y:21}];
var grid=[],dots=[],dotCount=0,distDoor=[],tunnels=[];
var state="title",paused=false,closed=false,endAt=0,beat=false,beatAt=-1e9,now0=0,levelText=-1e9,flashAt=0,clearAt=0;
var stats={score:0,level:0,lives:LIVES,eaten:0},nextLife=EXTRA,ghosts=[],hero,keys={},want=null,fright=0,frightTotal=1,chain=0,scatterUntil=0,gem=null,gemAt=0,deadAt=0,dotsEaten=0;
function rnd(a,b){return a+Math.random()*(b-a)}
function ri(n){return Math.floor(Math.random()*n)}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function close(){if(closed)return;closed=true;g.clearRect(0,0,W,H);drip.end()}
function tune(n){return{ghost:Math.min(1.12,0.78+0.045*n),fright:Math.max(2,7-0.6*n),release:Math.max(0.6,2.2-0.2*n),scatter:Math.max(1.5,5-0.4*n),bold:Math.min(0.95,0.55+0.05*n)}}
var P=tune(1);
function inPen(x,y){return x>=PEN.x0&&x<=PEN.x1&&y>=PEN.y0&&y<=PEN.y1}
function isDoor(x,y){return x===DOOR.x&&y===DOOR.y+1}
function wall(x,y){if(y<0||y>=ROWS)return true;if(x<0||x>=COLS)return !tunnels.some(function(r){return r===y});return grid[y][x]===1}
// A fresh maze: a spanning tree carved over the left half, mirrored, joined
// across the middle, its dead ends knocked through, two tunnels, the pen.
function makeMaze(){
  grid=[];for(var y=0;y<ROWS;y++){grid.push([]);for(var x=0;x<COLS;x++)grid[y].push(1)}
  function cellOk(x,y){return x>=1&&x<=9&&y>=1&&y<=ROWS-2&&x%2===1&&y%2===1&&!inPen(x,y)}
  var seen={},stack=[],sx=1,sy=1;seen[sx+","+sy]=1;grid[sy][sx]=0;stack.push([sx,sy]);
  while(stack.length){var cur=stack[ri(stack.length)>stack.length*0.3?stack.length-1:ri(stack.length)],x=cur[0],y=cur[1],opts=[];
    [[2,0],[-2,0],[0,2],[0,-2]].forEach(function(d){var nx=x+d[0],ny=y+d[1];if(cellOk(nx,ny)&&!seen[nx+","+ny])opts.push([nx,ny])});
    if(!opts.length){stack.splice(stack.indexOf(cur),1);continue}
    var n=opts[ri(opts.length)];seen[n[0]+","+n[1]]=1;grid[n[1]][n[0]]=0;grid[(y+n[1])/2][(x+n[0])/2]=0;stack.push(n)}
  function mirror(){for(var y=0;y<ROWS;y++)for(var x=0;x<CX;x++)grid[y][COLS-1-x]=grid[y][x]}
  // Crossings over the middle: above and below the pen, the hero's row, the ends and a few more.
  var cross=[1,DOOR.y,13,START.y,ROWS-2];for(var y=3;y<ROWS-2;y+=2)if(Math.random()<0.35&&cross.indexOf(y)<0)cross.push(y);
  cross.forEach(function(y){if(!inPen(CX,y)){grid[y][CX]=0;grid[y][CX-1]=0;grid[y][CX+1]=0}});
  mirror();
  for(var pass=0;pass<3;pass++){for(var y=1;y<ROWS-1;y+=2)for(var x=1;x<=9;x+=2){if(grid[y][x]!==0||inPen(x,y))continue;
    var open=0,cand=[];[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var px=x+d[0],py=y+d[1],nx=x+2*d[0],ny=y+2*d[1];
      if(grid[py]&&grid[py][px]===0)open++;else if(ny>0&&ny<ROWS-1&&nx>0&&nx<COLS-1&&!inPen(nx,ny)&&!inPen(px,py)&&grid[ny][nx]===0)cand.push([px,py])});
    if(open<=1&&cand.length){var k=cand[ri(cand.length)];grid[k[1]][k[0]]=0}}
    mirror()}
  // The pen, its door and the chomper's start.
  for(var y=PEN.y0;y<=PEN.y1;y++)for(var x=PEN.x0;x<=PEN.x1;x++)grid[y][x]=1;
  for(var x=PEN.x0+1;x<PEN.x1;x++)grid[HOME.y][x]=0;grid[DOOR.y+1][DOOR.x]=2;grid[DOOR.y][DOOR.x]=0;grid[DOOR.y][DOOR.x-1]=0;grid[DOOR.y][DOOR.x+1]=0;
  grid[START.y][START.x]=0;grid[START.y][START.x-1]=0;grid[START.y][START.x+1]=0;
  // Tunnels: two rows that run off both edges and wrap.
  tunnels=[];var rows=[];for(var y=3;y<ROWS-3;y+=2)if(Math.abs(y-HOME.y)>2)rows.push(y);
  while(tunnels.length<2&&rows.length){var ty=rows.splice(ri(rows.length),1)[0];if(tunnels.some(function(r){return Math.abs(r-ty)<4}))continue;tunnels.push(ty);grid[ty][0]=0;grid[ty][COLS-1]=0;grid[ty][1]=0;grid[ty][COLS-2]=0}
  // Dots everywhere a corridor is, pellets in the corners, none where the chomper starts or the tunnels run out.
  dots=[];dotCount=0;for(var y=0;y<ROWS;y++){dots.push([]);for(var x=0;x<COLS;x++){var d=0;if(grid[y][x]===0&&!inPen(x,y)&&!(y===DOOR.y&&Math.abs(x-DOOR.x)<=1)&&!(y===START.y&&Math.abs(x-START.x)<=1)&&!(tunnels.indexOf(y)>=0&&(x<=1||x>=COLS-2)))d=1;dots[y].push(d);if(d)dotCount++}}
  CORNERS.forEach(function(p){var best=null,bd=1e9;for(var y=1;y<ROWS-1;y++)for(var x=1;x<COLS-1;x++)if(dots[y][x]===1){var dd=Math.abs(x-p.x)+Math.abs(y-p.y);if(dd<bd){bd=dd;best=[x,y]}}if(best)dots[best[1]][best[0]]=2});
  // How far each tile is from the pen door, for spooks heading home.
  distDoor=[];for(var y=0;y<ROWS;y++){distDoor.push([]);for(var x=0;x<COLS;x++)distDoor[y].push(1e9)}
  var q=[[DOOR.x,DOOR.y]];distDoor[DOOR.y][DOOR.x]=0;while(q.length){var cur=q.shift(),cx=cur[0],cy=cur[1];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var nx=cx+d[0],ny=cy+d[1];if(nx<0)nx=COLS-1;if(nx>=COLS)nx=0;if(ny<0||ny>=ROWS||grid[ny][nx]!==0||distDoor[ny][nx]<1e9)return;distDoor[ny][nx]=distDoor[cy][cx]+1;q.push([nx,ny])})}
}
function makeGhosts(){ghosts=[];for(var i=0;i<4;i++)ghosts.push({i:i,x:HOME.x-1+i%3+(i===3?0.5:0),y:HOME.y+0.5,dir:[0,-1],mode:"pen",col:GCOL[i],releaseAt:now0+(i*P.release+0.8)*1000,bob:rnd(0,6)})}
function resetHero(){hero={x:START.x+0.5,y:START.y+0.5,dir:[0,0],face:[1,0],mouth:0,dead:false};want=null;keys={}}
function startLevel(){stats.level++;P=tune(stats.level);makeMaze();makeGhosts();resetHero();fright=0;chain=0;gem=null;dotsEaten=0;levelText=now0;scatterUntil=now0+P.scatter*1000;
  if(stats.level>1)drip.sfx.notes([[523,0.08,0],[659,0.08,0.09],[784,0.08,0.18],[1047,0.22,0.27]],"triangle",0.08)}
function addScore(n){stats.score+=n;drip.score(stats.score);
  if(stats.score>=nextLife){nextLife+=EXTRA;stats.lives++;drip.sfx.notes([[880,0.08,0],[1175,0.08,0.09],[1760,0.2,0.18]],"square",0.06)}
  if(BEST>0&&!beat&&stats.score>BEST){beat=true;beatAt=now0;drip.sfx.notes([[784,0.08,0],[988,0.08,0.08],[1319,0.24,0.16]],"triangle",0.1)}}
function begin(){state="play";stats.score=0;stats.level=0;stats.lives=LIVES;stats.eaten=0;nextLife=EXTRA;startLevel();drip.sfx.notes([[262,0.1,0],[330,0.1,0.1],[392,0.1,0.2],[523,0.25,0.3]],"triangle",0.09)}
function gameOver(){state="end";endAt=now0;if(beat)drip.sfx.notes([[523,0.12,0.4],[659,0.12,0.52],[784,0.12,0.64],[1047,0.35,0.76]]);else drip.sfx.notes([[392,0.2,0.4],[330,0.2,0.6],[262,0.45,0.8]],"triangle",0.14)}
var KEYS={ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0],ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1]};
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"||ev.key==="m"||ev.key==="M")return;
  if(state==="title"){ev.preventDefault();begin();return}
  if(ev.key==="p"||ev.key==="P"){ev.preventDefault();if(state==="play"&&!ev.repeat){paused=!paused;drip.sfx.tone(paused?440:660,0.08,"triangle",0.06)}return}
  var d=KEYS[ev.key];if(!d)return;ev.preventDefault();want=d;keys[ev.key]=true});
document.addEventListener("keyup",function(ev){delete keys[ev.key]});
document.addEventListener("mousedown",function(ev){ev.preventDefault();if(state==="title"){begin();return}
  // A click steers too: towards the side of the chomper it lands on.
  var dx=ev.clientX-(OX+hero.x*T),dy=ev.clientY-(OY+hero.y*T);want=Math.abs(dx)>Math.abs(dy)?[dx>0?1:-1,0]:[0,dy>0?1:-1]});
function open(x,y,ghost){if(x<0||x>=COLS){return tunnels.indexOf(y)>=0}if(y<0||y>=ROWS)return false;var v=grid[y][x];return v===0||(v===2&&ghost)}
// Movement on the grid: a thing runs along its direction, and at each tile
// centre may turn (or must stop) by what is open; the tunnels wrap.
function advance(o,speed,dt,decide,ghost){var left=speed*dt;var guard=0;
  while(left>0&&guard++<8){var tx=Math.floor(o.x),ty=Math.floor(o.y),cx=tx+0.5,cy=ty+0.5,dx=o.dir[0],dy=o.dir[1];
    var toC=dx!==0?(cx-o.x)*dx:dy!==0?(cy-o.y)*dy:0;
    if((dx===0&&dy===0)||Math.abs(o.x-cx)<1e-6&&Math.abs(o.y-cy)<1e-6){o.x=cx;o.y=cy;var nd=decide(tx,ty);if(!nd){return}o.dir=nd;dx=nd[0];dy=nd[1];toC=1}
    else if(toC<=1e-6)toC=1+toC;
    var m=Math.min(left,toC);o.x+=dx*m;o.y+=dy*m;left-=m;
    if(o.x<-0.5)o.x+=COLS;if(o.x>COLS+0.5)o.x-=COLS;
    if(Math.abs(o.x-(Math.floor(o.x)+0.5))<1e-6&&Math.abs(o.y-(Math.floor(o.y)+0.5))<1e-6){tx=Math.floor(o.x);ty=Math.floor(o.y);var nd2=decide(tx,ty);if(!nd2){o.dir=[0,0];return}o.dir=nd2}}}
function heroDecide(tx,ty){var nx;if(want&&open(((nx=tx+want[0])+COLS)%COLS,ty+want[1],false)){hero.face=want;return want}
  if(hero.dir[0]||hero.dir[1]){if(open(((tx+hero.dir[0])+COLS)%COLS,ty+hero.dir[1],false))return hero.dir}return null}
function ghostTarget(gh){var hx=Math.floor(hero.x),hy=Math.floor(hero.y);
  if(gh.mode==="eaten")return DOOR;
  if(now0<scatterUntil||Math.random()>P.bold)return CORNERS[gh.i];
  if(gh.i===0)return{x:hx,y:hy};
  if(gh.i===1)return{x:hx+hero.face[0]*4,y:hy+hero.face[1]*4};
  if(gh.i===2){return Math.abs(hx-gh.x)+Math.abs(hy-gh.y)>8?{x:hx,y:hy}:CORNERS[2]}
  var g0=ghosts[0];return{x:hx+(hx-Math.floor(g0.x)),y:hy+(hy-Math.floor(g0.y))}}
function ghostDecide(gh){return function(tx,ty){var back=[-gh.dir[0],-gh.dir[1]],opts=[];
  [[0,-1],[-1,0],[0,1],[1,0]].forEach(function(d){if(d[0]===back[0]&&d[1]===back[1])return;var nx=tx+d[0],ny=ty+d[1];
    if(gh.mode!=="eaten"&&gh.mode!=="pen"&&grid[ny]&&grid[ny][nx]===2)return;if(open((nx+COLS)%COLS,ny,true))opts.push(d)});
  if(!opts.length)return back;
  if(gh.mode==="fright")return opts[ri(opts.length)];
  if(gh.mode==="eaten"){var bestD=null,bd=1e9;opts.forEach(function(d){var nx=(tx+d[0]+COLS)%COLS,ny=ty+d[1],v=distDoor[ny]?distDoor[ny][nx]:1e9;if(v<bd){bd=v;bestD=d}});return bestD}
  var t=ghostTarget(gh),b2=null,bd2=1e18;opts.forEach(function(d){var nx=tx+d[0],ny=ty+d[1],v=(nx-t.x)*(nx-t.x)+(ny-t.y)*(ny-t.y);if(v<bd2){bd2=v;b2=d}});return b2}}
function eatPellet(){fright=P.fright*1000;frightTotal=fright;chain=0;ghosts.forEach(function(gh){if(gh.mode==="chase"){gh.mode="fright";gh.dir=[-gh.dir[0],-gh.dir[1]]}});
  drip.sfx.notes([[330,0.1,0],[262,0.1,0.1],[208,0.18,0.2]],"square",0.07)}
function loseLife(){if(hero.dead)return;hero.dead=true;deadAt=now0;stats.lives--;drip.sfx.noise(0.6,0.4,1500,80);drip.sfx.tone(600,0.9,"sawtooth",0.08,60)}
function step(dt){
  if(clearAt){if(now0-clearAt>1800){clearAt=0;startLevel()}return}
  if(hero.dead){if(now0-deadAt>1400){if(stats.lives<=0)gameOver();else{makeGhosts();resetHero();fright=0;scatterUntil=now0+P.scatter*1000}}return}
  var hs=7.2*(1+0.02*stats.level);advance(hero,hs,dt,heroDecide,false);
  hero.mouth=(hero.dir[0]||hero.dir[1])?hero.mouth+dt*14:hero.mouth*0.8;
  var tx=Math.floor(hero.x),ty=Math.floor(hero.y);
  if(dots[ty]&&dots[ty][tx]){var d=dots[ty][tx];dots[ty][tx]=0;dotCount--;dotsEaten++;
    if(d===2){addScore(50);eatPellet()}else{addScore(10);if(dotsEaten%2===0)drip.sfx.tone(dotsEaten%4===0?520:440,0.04,"square",0.035)}
    if((dotsEaten===60||dotsEaten===150)&&!gem){gem={x:START.x,y:START.y,until:now0+9000};gemAt=now0}
    if(dotCount<=0){clearAt=now0;flashAt=now0;addScore(500*stats.level);drip.sfx.notes([[523,0.1,0],[659,0.1,0.12],[784,0.1,0.24],[1047,0.1,0.36],[1319,0.3,0.48]],"triangle",0.09);return}}
  if(gem){if(now0>gem.until)gem=null;else if(tx===gem.x&&ty===gem.y){addScore(100*stats.level);drip.sfx.notes([[880,0.08,0],[1320,0.08,0.08],[1760,0.2,0.16]],"square",0.06);gem=null}}
  if(fright>0){fright-=dt*1000;if(fright<=0){fright=0;ghosts.forEach(function(gh){if(gh.mode==="fright")gh.mode="chase"})}}
  ghosts.forEach(function(gh){
    if(gh.mode==="pen"){gh.bob+=dt*4;if(now0>=gh.releaseAt){gh.mode="leave";gh.x=HOME.x+0.5;gh.y=HOME.y+0.5;gh.dir=[0,-1]}return}
    if(gh.mode==="leave"){gh.y-=dt*4;if(gh.y<=DOOR.y+0.5){gh.y=DOOR.y+0.5;gh.x=DOOR.x+0.5;gh.mode=fright>0?"fright":"chase";gh.dir=Math.random()<0.5?[-1,0]:[1,0]}return}
    if(gh.mode==="home"){gh.y+=dt*4;if(gh.y>=HOME.y+0.5){gh.y=HOME.y+0.5;gh.mode="pen";gh.releaseAt=now0+700}return}
    var sp=hs*(gh.mode==="eaten"?1.6:gh.mode==="fright"?0.55:P.ghost);if(tunnels.indexOf(Math.floor(gh.y))>=0&&(gh.x<2||gh.x>COLS-2)&&gh.mode!=="eaten")sp*=0.55;
    advance(gh,sp,dt,ghostDecide(gh),true);
    if(gh.mode==="eaten"&&Math.abs(gh.x-(DOOR.x+0.5))<0.1&&Math.abs(gh.y-(DOOR.y+0.5))<0.1){gh.mode="home";gh.dir=[0,1]}
    var dx=gh.x-hero.x,dy=gh.y-hero.y;if(dx*dx+dy*dy<0.45){
      if(gh.mode==="fright"){chain++;var pts=200*Math.pow(2,chain-1);addScore(pts);stats.eaten++;gh.mode="eaten";gh.say={t:now0,pts:pts,x:gh.x,y:gh.y};drip.sfx.notes([[440,0.06,0],[660,0.06,0.06],[990,0.12,0.12]],"square",0.07)}
      else if(gh.mode==="chase")loseLife()}});
}
function text(str,x,y,size,col,align){g.font="900 "+Math.round(size)+"px Menlo, Monaco, 'Courier New', monospace";g.textAlign=align||"left";g.textBaseline="top";
  g.fillStyle="rgba(0,0,0,0.8)";g.fillText(str,x+Math.max(2,size/9),y+Math.max(2,size/9));g.fillStyle=col;g.fillText(str,x,y)}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function drawMaze(){var flash=clearAt&&Math.floor((now0-flashAt)/200)%2===1;
  g.fillStyle="rgba(8,5,26,0.82)";rr(OX-8,OY-8,COLS*T+16,ROWS*T+16,10);g.fill();
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){var v=grid[y][x],px=OX+x*T,py=OY+y*T;
    if(v===1){g.fillStyle=flash?"#ede9fe":"#2e1065";rr(px+1,py+1,T-2,T-2,Math.max(2,T*0.22));g.fill();g.strokeStyle=flash?"#fff":"#7c3aed";g.lineWidth=Math.max(1,T*0.08);g.stroke()}
    else if(v===2){g.fillStyle="#f0abfc";g.fillRect(px+T*0.1,py+T*0.42,T*0.8,T*0.16)}
    else if(dots[y][x]===1){g.fillStyle="#fde68a";g.fillRect(px+T*0.42,py+T*0.42,T*0.16,T*0.16)}
    else if(dots[y][x]===2){var pr=T*(0.22+0.06*Math.sin(now0/150));g.fillStyle="#f0abfc";g.shadowColor="#f0abfc";g.shadowBlur=T*0.5;g.beginPath();g.arc(px+T/2,py+T/2,pr,0,Math.PI*2);g.fill();g.shadowBlur=0}}
  if(gem&&Math.floor(now0/150)%6!==0){var gx=OX+(gem.x+0.5)*T,gy=OY+(gem.y+0.5)*T,r=T*0.36;g.fillStyle="#34d399";g.shadowColor="#34d399";g.shadowBlur=T*0.5;g.beginPath();g.moveTo(gx,gy-r);g.lineTo(gx+r*0.8,gy);g.lineTo(gx,gy+r);g.lineTo(gx-r*0.8,gy);g.closePath();g.fill();g.shadowBlur=0;g.fillStyle="#d1fae5";g.fillRect(gx-r*0.15,gy-r*0.5,r*0.3,r*0.3)}}
// The chomper: a round lime body with a hinged lower jaw and two keen eyes.
function drawHero(x,y,face,mouth,scale,dead){var r=T*0.44*scale,ang=Math.atan2(face[1],face[0]),jaw=dead?Math.PI*0.6:(0.15+0.45*Math.abs(Math.sin(mouth)));
  g.save();g.translate(x,y);g.rotate(ang);g.shadowColor="#a3e635";g.shadowBlur=T*0.4;
  g.fillStyle="#84cc16";g.beginPath();g.arc(0,0,r,Math.PI,0);g.lineTo(r,0);g.lineTo(-r,0);g.closePath();g.fill();
  g.fillStyle="#65a30d";g.save();g.translate(-r*0.6,0);g.rotate(jaw);g.beginPath();g.arc(r*0.6,0,r,0,Math.PI);g.closePath();g.fill();
  g.fillStyle="#fff";for(var i=0;i<3;i++){g.beginPath();g.moveTo(r*0.2+i*r*0.4,0);g.lineTo(r*0.35+i*r*0.4,r*0.3);g.lineTo(r*0.5+i*r*0.4,0);g.fill()}g.restore();
  g.shadowBlur=0;g.fillStyle="#fff";g.beginPath();g.arc(r*0.35,-r*0.45,r*0.26,0,Math.PI*2);g.fill();g.fillStyle="#111";g.beginPath();g.arc(r*0.45,-r*0.45,r*0.12,0,Math.PI*2);g.fill();
  g.fillStyle="#fff";g.beginPath();g.moveTo(-r*0.7,-r*0.5);g.lineTo(-r*0.3,-r*0.95);g.lineTo(-r*0.1,-r*0.5);g.closePath();g.fill();g.restore()}
// A spook: a pointed hood over a round body, one wide eye, and a trailing wisp.
function drawGhost(gh){var x=OX+gh.x*T,y=OY+gh.y*T,r=T*0.42;if(gh.mode==="pen")y+=Math.sin(gh.bob)*T*0.12;
  var fr=gh.mode==="fright",flash=fr&&fright<1500&&Math.floor(now0/150)%2===0,eaten=gh.mode==="eaten"||gh.mode==="home";
  g.save();g.translate(x,y);
  if(!eaten){var col=fr?(flash?"#e0e7ff":"#1e3a8a"):gh.col;g.fillStyle=col;g.shadowColor=col;g.shadowBlur=T*0.4;
    g.beginPath();g.moveTo(0,-r*1.25);g.quadraticCurveTo(r*0.9,-r*0.9,r,0);g.quadraticCurveTo(r*1.05,r*0.6,r*0.5,r);
    var wob=Math.sin(now0/90+gh.i)*r*0.25;g.quadraticCurveTo(r*0.2,r*1.2+wob,0,r*0.9);g.quadraticCurveTo(-r*0.2,r*1.2-wob,-r*0.5,r);g.quadraticCurveTo(-r*1.05,r*0.6,-r,0);g.quadraticCurveTo(-r*0.9,-r*0.9,0,-r*1.25);g.closePath();g.fill();g.shadowBlur=0}
  var ex=gh.dir[0]*r*0.18,ey=gh.dir[1]*r*0.18;g.fillStyle=fr&&!eaten?(flash?"#1e3a8a":"#e0e7ff"):"#fff";g.beginPath();g.ellipse(0,-r*0.15,r*0.55,r*0.32,0,0,Math.PI*2);g.fill();
  if(!(fr&&!eaten)){g.fillStyle="#0f172a";g.beginPath();g.arc(ex,-r*0.15+ey,r*0.17,0,Math.PI*2);g.fill()}
  if(fr&&!eaten){g.strokeStyle=flash?"#1e3a8a":"#e0e7ff";g.lineWidth=Math.max(1,T*0.06);g.beginPath();g.moveTo(-r*0.5,r*0.45);for(var i=0;i<4;i++)g.lineTo(-r*0.5+(i+0.5)*r*0.25,r*(i%2?0.55:0.35));g.stroke()}
  g.restore();
  if(gh.say&&now0-gh.say.t<900){g.save();g.globalAlpha=1-(now0-gh.say.t)/900;text(String(gh.say.pts),OX+gh.say.x*T,OY+gh.say.y*T-T*0.8-(now0-gh.say.t)*0.01,Math.max(10,T*0.7),"#a5f3fc","center");g.restore()}}
function drawHud(){var size=Math.max(12,Math.min(20,T*0.75)),y=OY-size-12;
  text(fmt(stats.score),OX,y,size*1.2,"#fff","left");
  text("BEST "+fmt(Math.max(BEST,stats.score)),OX+COLS*T,y,size*0.85,"#fde68a","right");
  text("MAZE "+stats.level,OX+COLS*T/2,y+size*0.1,size*0.75,"#a78bfa","center");
  var by=OY+ROWS*T+8;for(var i=0;i<Math.min(stats.lives,8);i++)drawHero(OX+T*0.5+i*T*1.1,by+size*0.55,[1,0],0,0.8,false);
  text((drip.muted()?"M SOUND ON":"M MUTES")+"   P PAUSE   ESC QUIT",OX+COLS*T,by+size*0.2,size*0.6,"rgba(255,255,255,0.6)","right")}
function drawTitle(t){var big=Math.max(26,Math.min(64,W*0.07)),y=H*0.26;
  g.fillStyle="rgba(6,4,18,0.6)";g.fillRect(0,0,W,H);
  text("CHOMP",W/2,y,big,"#84cc16","center");
  text("ARROWS MOVE   P PAUSES",W/2,y+big*1.5,Math.max(12,big*0.3),"#fff","center");
  text("BEST "+fmt(BEST),W/2,y+big*2.3,Math.max(14,big*0.42),"#fde68a","center");
  if(Math.floor(t/500)%2===0)text("PRESS ANY KEY",W/2,y+big*3.3,Math.max(12,big*0.3),"rgba(255,255,255,0.85)","center");
  var hx=W/2-big*2.1,hy=y+big*0.5;drawHero(hx,hy,[1,0],t/70,big/T*0.9,false);
  var keep=T;T=big*0.9;for(var i=0;i<4;i++)drawGhost({i:i,x:(W/2+big*2+i*big*0.75-OX)/T,y:(hy-OY)/T,dir:[-1,0],mode:"chase",col:GCOL[i],bob:0});T=keep}
function drawEnd(){var k=Math.min(1,(now0-endAt)/250),bw=Math.min(W*0.8,520),bh=Math.max(140,Math.min(220,H*0.34)),bx=W/2-bw/2,by=H*0.45-bh/2;
  g.save();g.globalAlpha=k;g.fillStyle="rgba(8,5,26,0.94)";g.fillRect(bx,by,bw,bh);g.strokeStyle="#84cc16";g.lineWidth=4;g.strokeRect(bx,by,bw,bh);
  var big=Math.max(18,Math.min(40,bw/13));
  text("GAME OVER",W/2,by+bh*0.12,big,"#fb7185","center");
  text("SCORE "+fmt(stats.score),W/2,by+bh*0.12+big*1.5,big,"#fde68a","center");
  text(beat?"NEW BEST!":BEST>0?"BEST "+fmt(BEST):"MAZE "+stats.level+"   "+stats.eaten+" SPOOKS EATEN",W/2,by+bh*0.12+big*2.9,Math.max(12,big*0.5),beat?"#fde68a":"#fff","center");g.restore()}
makeMaze();resetHero();makeGhosts();
window.__chomp={stats:stats,ghosts:function(){return ghosts},hero:function(){return hero},state:function(){return state},dots:function(){return dotCount},fright:function(){return fright}};
var last=performance.now();
function frame(now){if(closed)return;var dt=Math.min(0.05,(now-last)/1000);last=now;now0=now;
  if(state==="play"&&!paused)step(dt);
  g.clearRect(0,0,W,H);
  drawMaze();
  if(state!=="title"){
    ghosts.forEach(function(gh){if(gh.mode!=="eaten"&&gh.mode!=="home")drawGhost(gh)});
    var hx=OX+hero.x*T,hy=OY+hero.y*T;if(hero.dead){var k=Math.min(1,(now0-deadAt)/1000);g.save();g.translate(hx,hy);g.rotate(k*Math.PI*4);g.translate(-hx,-hy);drawHero(hx,hy,hero.face,0,1-k,true);g.restore()}else drawHero(hx,hy,hero.face,hero.mouth,1,false);
    ghosts.forEach(function(gh){if(gh.mode==="eaten"||gh.mode==="home")drawGhost(gh)});
    drawHud();
    if(now-levelText<1600&&!clearAt){g.save();g.globalAlpha=Math.min(1,(1600-(now-levelText))/400);text(stats.level===1?"READY!":"MAZE "+stats.level,W/2,OY+(HOME.y+2.5)*T,Math.max(16,T*1.1),"#a78bfa","center");g.restore()}
    if(clearAt)text("MAZE CLEAR!",W/2,OY+(HOME.y+2.5)*T,Math.max(16,T*1.1),"#fde68a","center");
    if(now-beatAt<1400){g.save();g.globalAlpha=Math.min(1,(1400-(now-beatAt))/300);text("NEW BEST!",W/2,OY+T*3,Math.max(16,T*1.1),"#fde68a","center");g.restore()}
    if(paused)text("PAUSED",W/2,H*0.45,Math.max(20,T*1.4),"#fff","center");
  } else drawTitle(now);
  if(state==="end"){drawEnd();if(now-endAt>=ENDMS){close();return}}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
