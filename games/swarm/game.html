<!doctype html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;user-select:none;-webkit-user-select:none}
canvas{position:absolute;left:0;top:0}
</style></head><body>
<canvas id="c"></canvas>
<script>
// Swarm: waves of aliens march across the top and dive at your ship. ← → (or
// A D) moves, space fires, P pauses. Three bunkers shield you and wear away
// with every hit. Each wave is faster, meaner and drops more bombs.
(function(){
var W=drip.width,H=drip.height,BEST=drip.best||0,ENDMS=2300,LIVES=3;
var c=document.getElementById("c");c.width=W;c.height=H;var g=c.getContext("2d");
var K=Math.max(0.55,Math.min(1.6,Math.min(W,H)/800));
var CW=52*K,CH=40*K,PX=CW/14,FLOOR=H-30*K,SHIP_Y=FLOOR-18*K,SHIELD_Y=FLOOR-120*K;
var COLS=["#48f0c8","#ff6fb5","#ffd166","#9b7bff","#7cf26a","#ff8c42"];
// Our own pixel sprites, two frames each: a kite, a jelly and a bat.
var SPRITES=[
 [["....xxx....",".x.xxxxx.x.","xxxxxxxxxxx","xx.xxxxx.xx","xxxxxxxxxxx","..xx...xx..",".x..xxx..x.","x.........x"],
  ["....xxx....","...xxxxx...","x.xxxxxxx.x","xxx.xxx.xxx","xxxxxxxxxxx","..xx...xx..","..x.xxx.x..","...x...x..."]],
 [["...xxxxx...",".xxxxxxxxx.","xxx.xxx.xxx","xxxxxxxxxxx",".xxxxxxxxx.","..x.x.x.x..",".x.x...x.x.","x.........x"],
  ["...xxxxx...",".xxxxxxxxx.","xxx.xxx.xxx","xxxxxxxxxxx",".xxxxxxxxx.","..x.x.x.x..","...x.x.x...","..x.....x.."]],
 [["x.........x",".x.......x.","..xxxxxxx..",".xx.xxx.xx.","xxxxxxxxxxx","x.xxxxxxx.x","x.x.....x.x","...xx.xx..."],
  ["..x.....x..","...x...x...","..xxxxxxx..",".xx.xxx.xx.","xxxxxxxxxxx","..xxxxxxx..","..x.....x..",".x.......x."]]];
var state="title",paused=false,closed=false,endAt=0,beat=false,beatAt=-1e9,shake=0,now0=0,start=0,waveText=-1e9;
var stats={score:0,wave:0,lives:LIVES,kills:0};
var ship={x:W/2,alive:true,back:0,safeUntil:0},keys={},shots=[],bombs=[],aliens=[],parts=[],shields=[],saucer=null,saucerAt=0,lastShot=0;
var form={x:0,y:0,dir:1,speed:0,anim:0,animAt:0,diveAt:0,bombAt:0,cols:0,rows:0,w:0};
var P={};
function rnd(a,b){return a+Math.random()*(b-a)}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function tune(n){return{cols:Math.min(11,8+Math.floor((n-1)/2)),rows:Math.min(6,4+Math.floor((n-1)/3)),speed:(40+12*n)*K,drop:(14+2*n)*K,
  bombEvery:Math.max(0.35,1.6-0.14*n),bombSpeed:(160+22*n)*K,diveEvery:Math.max(1.6,6-0.5*n),diveSpeed:(200+25*n)*K,shots:n>=4?3:2,saucerEvery:n>=2?rnd(10,18):0,pts:1+(n-1)*0.25}}
function close(){if(closed)return;closed=true;g.clearRect(0,0,W,H);drip.end()}
function burst(x,y,n,cols,speed,life){for(var i=0;i<n;i++){var a=rnd(0,Math.PI*2),v=rnd(0.2,1)*speed*K;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(0.5,1)*life,max:life,size:rnd(1.5,3.5)*K,col:cols[i%cols.length]})}}
function addScore(n){stats.score+=Math.round(n);drip.score(stats.score);
  if(BEST>0&&!beat&&stats.score>BEST){beat=true;beatAt=now0;drip.sfx.notes([[784,0.08,0],[988,0.08,0.08],[1319,0.24,0.16]],"triangle",0.1)}}
function buildShields(n){shields=[];var cell=6*K,cols=9,rows=Math.max(3,6-Math.floor((n-1)/3));
  [0.22,0.5,0.78].forEach(function(f){var x0=W*f-cols*cell/2,cells=[];
    for(var r=0;r<rows;r++)for(var q=0;q<cols;q++){if(r===0&&(q===0||q===cols-1))continue;if(r>=rows-2&&q>=3&&q<=5)continue;cells.push({x:x0+q*cell,y:SHIELD_Y+r*cell,on:true})}
    shields.push({cells:cells,cell:cell})})}
function startWave(){stats.wave++;P=tune(stats.wave);waveText=now0;bombs.length=0;aliens=[];
  form.cols=P.cols;form.rows=P.rows;form.w=form.cols*CW;form.x=W/2-form.w/2;form.y=60*K;form.dir=1;form.speed=P.speed;form.diveAt=now0+P.diveEvery*1000*1.5;form.bombAt=now0+1500;
  for(var r=0;r<form.rows;r++)for(var q=0;q<form.cols;q++){var kind=r<2?2:r<4?1:0;aliens.push({r:r,q:q,kind:kind,col:COLS[(r+stats.wave)%COLS.length],alive:true,dive:null,x:0,y:0})}
  buildShields(stats.wave);saucerAt=P.saucerEvery?now0+P.saucerEvery*1000:0;
  if(stats.wave>1)drip.sfx.notes([[523,0.08,0],[659,0.08,0.09],[784,0.08,0.18],[1047,0.2,0.27]],"triangle",0.08)}
function slot(a){return{x:form.x+a.q*CW+CW/2,y:form.y+a.r*CH+CH/2}}
function living(){return aliens.filter(function(a){return a.alive})}
function fire(){if(state!=="play"||paused||!ship.alive||now0-lastShot<260||shots.length>=P.shots)return;lastShot=now0;
  shots.push({x:ship.x,y:SHIP_Y-14*K});drip.sfx.tone(1200,0.09,"square",0.05,400)}
function dive(){var cand=living().filter(function(a){return !a.dive});if(!cand.length)return;
  // The lowest alien of a column peels off, swoops at the ship and climbs back to its slot.
  var byCol={};cand.forEach(function(a){if(!byCol[a.q]||a.r>byCol[a.q].r)byCol[a.q]=a});var ks=Object.keys(byCol);var a=byCol[ks[Math.floor(Math.random()*ks.length)]];
  var s=slot(a);a.x=s.x;a.y=s.y;a.dive={t:0,x0:s.x,y0:s.y,tx:ship.x,amp:rnd(60,140)*K*(Math.random()<0.5?1:-1),dropped:false,phase:"down"};
  drip.sfx.tone(900,0.5,"sawtooth",0.05,200)}
function killAlien(a,byShot){a.alive=false;a.dive=null;stats.kills++;var base=a.kind===2?30:a.kind===1?20:10;var pts=base*P.pts*(byShot&&a.dive?2:1);addScore(pts);
  var p=a.dive?a:slot(a);burst(p.x,p.y,16,[a.col,"#fff","#8d99ae"],200,0.7);shake=Math.max(shake,2*K);
  drip.sfx.noise(0.25,0.3,2400,200);drip.sfx.tone(a.kind===2?220:a.kind===1?300:400,0.12,"square",0.06,80);
  if(!living().length){addScore(100*stats.wave);setTimeout(function(){if(state==="play")startWave()},1400)}}
function hitShield(x,y,r){for(var i=0;i<shields.length;i++){var s=shields[i];for(var j=0;j<s.cells.length;j++){var ce=s.cells[j];if(!ce.on)continue;
  if(x>=ce.x-r&&x<=ce.x+s.cell+r&&y>=ce.y-r&&y<=ce.y+s.cell+r){var cx=ce.x+s.cell/2,cy=ce.y+s.cell/2;
    for(var k=0;k<s.cells.length;k++){var o=s.cells[k];if(o.on&&Math.hypot(o.x+s.cell/2-cx,o.y+s.cell/2-cy)<=r+s.cell)o.on=false}
    burst(cx,cy,5,["#4fd1c5","#2c7a7b"],80,0.4);return true}}}return false}
function loseShip(){if(!ship.alive||now0<ship.safeUntil)return;ship.alive=false;stats.lives--;shake=10*K;
  burst(ship.x,SHIP_Y,36,["#fff","#48f0c8","#ffd166","#ff6fb5"],260,1.3);drip.sfx.noise(1.1,0.55,1200,50);drip.sfx.tone(280,0.9,"sawtooth",0.12,40);
  if(stats.lives<=0)gameOver();else ship.back=now0+1700}
function gameOver(){state="end";endAt=now0;bombs.length=0;
  if(beat)drip.sfx.notes([[523,0.12,0.5],[659,0.12,0.62],[784,0.12,0.74],[1047,0.35,0.86]]);else drip.sfx.notes([[392,0.2,0.5],[330,0.2,0.7],[262,0.45,0.9]],"triangle",0.14)}
function begin(){state="play";start=now0;stats.score=0;stats.wave=0;stats.lives=LIVES;ship.x=W/2;ship.alive=true;shots.length=0;startWave();
  drip.sfx.notes([[196,0.1,0],[262,0.1,0.1],[392,0.22,0.2]],"triangle",0.09)}
var KEYS={ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right"," ":"fire",ArrowUp:"fire",p:"pause",P:"pause"};
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"||ev.key==="m"||ev.key==="M")return;
  if(state==="title"){ev.preventDefault();begin();return}
  var k=KEYS[ev.key];if(!k)return;ev.preventDefault();keys[k]=true;
  if(ev.repeat)return;if(k==="fire")fire();else if(k==="pause"&&state==="play"){paused=!paused;drip.sfx.tone(paused?440:660,0.08,"triangle",0.06)}});
document.addEventListener("keyup",function(ev){var k=KEYS[ev.key];if(k)keys[k]=false});
document.addEventListener("mousedown",function(ev){ev.preventDefault();if(state==="title")begin();else fire()});
function text(str,x,y,size,col,align){g.font="900 "+Math.round(size)+"px Menlo, Monaco, 'Courier New', monospace";g.textAlign=align||"left";g.textBaseline="top";
  g.fillStyle="rgba(0,0,0,0.8)";g.fillText(str,x+Math.max(2,size/9),y+Math.max(2,size/9));g.fillStyle=col;g.fillText(str,x,y)}
function drawSprite(a,x,y,frame){var rows=SPRITES[a.kind][frame],x0=x-5.5*PX,y0=y-4*PX;g.fillStyle=a.col;
  for(var r=0;r<rows.length;r++)for(var q=0;q<11;q++)if(rows[r][q]==="x")g.fillRect(x0+q*PX,y0+r*PX,PX+0.5,PX+0.5);
  g.fillStyle="#fff";if(a.kind===0){g.fillRect(x0+3*PX,y0+3*PX,PX,PX);g.fillRect(x0+7*PX,y0+3*PX,PX,PX)}else if(a.kind===1){g.fillRect(x0+3*PX,y0+2*PX,PX,PX);g.fillRect(x0+7*PX,y0+2*PX,PX,PX)}else{g.fillRect(x0+3*PX,y0+3*PX,PX,PX);g.fillRect(x0+7*PX,y0+3*PX,PX,PX)}}
function drawShip(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.shadowColor="#48f0c8";g.shadowBlur=10*K;
  g.fillStyle="#0b3b3a";g.strokeStyle="#48f0c8";g.lineWidth=2*K;g.beginPath();g.moveTo(0,-16*K);g.lineTo(6*K,-4*K);g.lineTo(20*K,6*K);g.lineTo(14*K,10*K);g.lineTo(-14*K,10*K);g.lineTo(-20*K,6*K);g.lineTo(-6*K,-4*K);g.closePath();g.fill();g.stroke();
  g.fillStyle="#fff";g.fillRect(-2*K,-8*K,4*K,6*K);g.restore()}
function drawSaucer(s){g.save();g.translate(s.x,s.y);g.shadowColor="#ffd166";g.shadowBlur=10*K;g.strokeStyle="#ffd166";g.fillStyle="#3a2a05";g.lineWidth=2*K;
  g.beginPath();g.ellipse(0,0,22*K,7*K,0,0,Math.PI*2);g.fill();g.stroke();g.beginPath();g.ellipse(0,-5*K,10*K,7*K,0,Math.PI,0);g.fill();g.stroke();
  g.fillStyle="#ffd166";for(var i=-1;i<=1;i++)g.fillRect(i*10*K-1.5*K,-1.5*K,3*K,3*K);g.restore()}
function drawShields(){g.fillStyle="#2c9a8a";for(var i=0;i<shields.length;i++){var s=shields[i];for(var j=0;j<s.cells.length;j++){var ce=s.cells[j];if(ce.on)g.fillRect(ce.x,ce.y,s.cell+0.5,s.cell+0.5)}}}
function drawHud(){var size=Math.max(14,22*K),pad=16*K;
  text(fmt(stats.score),pad,pad,size*1.4,"#fff","left");
  for(var i=0;i<Math.min(stats.lives,8);i++)drawShip(pad+12*K+i*26*K,pad+size*2.6,0.55);
  text("BEST "+fmt(Math.max(BEST,stats.score)),W-pad,pad,size*0.8,"#ffd166","right");
  text("WAVE "+stats.wave,W-pad,pad+size*1.1,size*0.6,"#48f0c8","right");
  text((drip.muted()?"M SOUND ON":"M MUTES")+"   P PAUSE   ESC QUIT",W-pad,pad+size*1.9,size*0.5,"rgba(255,255,255,0.6)","right")}
function drawTitle(t){var big=Math.max(26,56*K),y=H*0.28;
  g.fillStyle="rgba(3,6,20,0.55)";g.fillRect(0,0,W,H);
  text("SWARM",W/2,y,big,"#48f0c8","center");
  text("← → MOVE   SPACE FIRES   P PAUSES",W/2,y+big*1.5,Math.max(12,big*0.3),"#fff","center");
  text("BEST "+fmt(BEST),W/2,y+big*2.3,Math.max(14,big*0.42),"#ffd166","center");
  if(Math.floor(t/500)%2===0)text("PRESS ANY KEY",W/2,y+big*3.3,Math.max(12,big*0.3),"rgba(255,255,255,0.85)","center");
  var demo={kind:Math.floor(t/1200)%3,col:COLS[Math.floor(t/1200)%COLS.length]};drawSprite(demo,W/2-big*2.2,y+big*0.5,Math.floor(t/400)%2);
  demo.kind=(demo.kind+1)%3;drawSprite(demo,W/2+big*2.2,y+big*0.5,Math.floor(t/400)%2)}
function drawEnd(){var k=Math.min(1,(now0-endAt)/250),bw=Math.min(W*0.8,560*K),bh=Math.max(140,200*K),bx=W/2-bw/2,by=H*0.42-bh/2;
  g.save();g.globalAlpha=k;g.fillStyle="rgba(5,8,28,0.93)";g.fillRect(bx,by,bw,bh);g.strokeStyle="#48f0c8";g.lineWidth=Math.max(3,4*K);g.strokeRect(bx,by,bw,bh);
  var big=Math.max(18,Math.min(40*K,bw/13));
  text("GAME OVER",W/2,by+bh*0.12,big,"#ff6fb5","center");
  text("SCORE "+fmt(stats.score),W/2,by+bh*0.12+big*1.5,big,"#ffd166","center");
  text(beat?"NEW BEST!":BEST>0?"BEST "+fmt(BEST):"WAVE "+stats.wave+"   "+stats.kills+" DOWN",W/2,by+bh*0.12+big*2.9,Math.max(12,big*0.5),beat?"#ffd166":"#fff","center");g.restore()}
// The title's own swarm: a formation that marches, nothing fired.
var titleForm={x:W*0.2,dir:1};
function step(dt){
  if(ship.alive){var sp=420*K;if(keys.left)ship.x-=sp*dt;if(keys.right)ship.x+=sp*dt;ship.x=Math.max(20*K,Math.min(W-20*K,ship.x));if(keys.fire)fire()}
  else if(stats.lives>0&&now0>=ship.back){ship.alive=true;ship.x=W/2;ship.safeUntil=now0+1800;drip.sfx.tone(440,0.2,"triangle",0.06,880)}
  var live=living();if(!live.length)return;
  // The formation marches, quicker as it thins, and drops a row at each edge.
  var alive=live.filter(function(a){return !a.dive}),minQ=99,maxQ=-1,maxR=-1;
  alive.forEach(function(a){if(a.q<minQ)minQ=a.q;if(a.q>maxQ)maxQ=a.q;if(a.r>maxR)maxR=a.r});
  if(maxQ>=0){var speed=form.speed*(1+2.2*(1-alive.length/(form.cols*form.rows)));form.x+=form.dir*speed*dt;
    var left=form.x+minQ*CW,right=form.x+(maxQ+1)*CW;
    if(form.dir>0&&right>W-10*K){form.dir=-1;form.y+=P.drop;drip.sfx.tone(90,0.08,"square",0.05)}else if(form.dir<0&&left<10*K){form.dir=1;form.y+=P.drop;drip.sfx.tone(90,0.08,"square",0.05)}
    if(form.y+(maxR+1)*CH>=SHIELD_Y){alive.forEach(function(a){var s=slot(a);if(s.y+CH/2>=SHIELD_Y)hitShield(s.x,s.y+CH/2,8*K)})}
    if(form.y+maxR*CH+CH/2>=SHIP_Y-10*K){if(ship.alive){loseShip()}else{gameOver()}return}}
  if(now0>=form.animAt){form.animAt=now0+Math.max(160,480-stats.wave*25);form.anim=1-form.anim}
  // Bombs from the lowest alien of a random column; divers when it's time.
  if(now0>=form.bombAt&&alive.length){form.bombAt=now0+P.bombEvery*1000*rnd(0.6,1.4);var byCol={};alive.forEach(function(a){if(!byCol[a.q]||a.r>byCol[a.q].r)byCol[a.q]=a});
    var ks=Object.keys(byCol),a=byCol[ks[Math.floor(Math.random()*ks.length)]],s=slot(a);if(Math.random()<0.35)a=byCol[ks.reduce(function(b,q){return Math.abs(slot(byCol[q]).x-ship.x)<Math.abs(slot(byCol[b]).x-ship.x)?q:b},ks[0])],s=slot(a);
    bombs.push({x:s.x,y:s.y+CH/2,vy:P.bombSpeed*rnd(0.8,1.2),wob:rnd(0,6.3)});drip.sfx.tone(300,0.1,"square",0.03,120)}
  if(now0>=form.diveAt){form.diveAt=now0+P.diveEvery*1000*rnd(0.7,1.3);dive()}
  for(var i=0;i<live.length;i++){var a=live[i];if(!a.dive)continue;var d=a.dive;d.t+=dt;
    if(d.phase==="down"){d.y=d.y0+d.t*P.diveSpeed;var prog=Math.min(1,(d.y-d.y0)/Math.max(1,SHIP_Y-d.y0));a.x=d.x0+(d.tx-d.x0)*prog+Math.sin(d.t*4)*d.amp*Math.sin(prog*Math.PI);a.y=d.y;
      if(!d.dropped&&a.y>SHIELD_Y-120*K&&Math.abs(a.x-ship.x)<60*K){d.dropped=true;bombs.push({x:a.x,y:a.y+10*K,vy:P.bombSpeed*1.4,wob:0})}
      if(ship.alive&&Math.abs(a.x-ship.x)<18*K&&Math.abs(a.y-SHIP_Y)<16*K){loseShip();killAlien(a,false);continue}
      if(a.y>H+20*K){d.phase="up";d.t=0;var s=slot(a);a.x=s.x;a.y=-30*K;d.sx=a.x}}
    else{var s2=slot(a);a.x+=(s2.x-a.x)*Math.min(1,dt*4);a.y+=(s2.y-a.y)*Math.min(1,dt*2.5);if(Math.abs(a.y-s2.y)<2*K&&Math.abs(a.x-s2.x)<2*K)a.dive=null}}
  for(var j=shots.length-1;j>=0;j--){var sh=shots[j];sh.y-=700*K*dt;if(sh.y<-10){shots.splice(j,1);continue}var hit=false;
    for(var q=0;q<aliens.length&&!hit;q++){var al=aliens[q];if(!al.alive)continue;var p=al.dive?al:slot(al);if(Math.abs(sh.x-p.x)<CW*0.42&&Math.abs(sh.y-p.y)<CH*0.42){killAlien(al,true);hit=true}}
    if(!hit&&saucer&&Math.abs(sh.x-saucer.x)<24*K&&Math.abs(sh.y-saucer.y)<10*K){addScore(150*P.pts);burst(saucer.x,saucer.y,24,["#ffd166","#fff"],220,1);drip.sfx.noise(0.5,0.4,2000,100);drip.sfx.notes([[880,0.08,0],[1320,0.16,0.08]],"square",0.06);saucer=null;hit=true}
    if(!hit&&hitShield(sh.x,sh.y,2*K))hit=true;
    if(!hit)for(var b=bombs.length-1;b>=0;b--){if(Math.abs(bombs[b].x-sh.x)<6*K&&Math.abs(bombs[b].y-sh.y)<10*K){burst(sh.x,sh.y,6,["#fff","#ff8c42"],120,0.4);bombs.splice(b,1);hit=true;break}}
    if(hit)shots.splice(j,1)}
  for(var k=bombs.length-1;k>=0;k--){var bm=bombs[k];bm.y+=bm.vy*dt;bm.wob+=dt*10;if(bm.y>FLOOR){bombs.splice(k,1);burst(bm.x,FLOOR,6,["#ff8c42","#8d99ae"],100,0.4);continue}
    if(hitShield(bm.x,bm.y,7*K)){bombs.splice(k,1);continue}
    if(ship.alive&&Math.abs(bm.x-ship.x)<16*K&&Math.abs(bm.y-SHIP_Y)<12*K){bombs.splice(k,1);loseShip()}}
  if(!saucer&&saucerAt&&now0>=saucerAt){saucerAt=now0+P.saucerEvery*1000;var fl=Math.random()<0.5;saucer={x:fl?-30*K:W+30*K,y:34*K,vx:(fl?1:-1)*140*K};drip.sfx.tone(600,0.3,"square",0.03,800)}
  if(saucer){saucer.x+=saucer.vx*dt;if(saucer.x<-40*K||saucer.x>W+40*K)saucer=null}
}
var last=performance.now();
function frame(now){if(closed)return;var dt=Math.min(0.05,(now-last)/1000);last=now;now0=now;
  if(state==="play"&&!paused)step(dt);
  g.clearRect(0,0,W,H);
  g.save();if(shake>0){g.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);shake=Math.max(0,shake-dt*40*K)}
  // The floor line.
  g.fillStyle="#1d6f66";g.fillRect(0,FLOOR,W,3*K);
  if(state==="title"){titleForm.x+=titleForm.dir*50*K*dt;if(titleForm.x>W*0.3)titleForm.dir=-1;if(titleForm.x<W*0.1)titleForm.dir=1;
    for(var r=0;r<3;r++)for(var q=0;q<Math.floor(W*0.6/CW);q++)drawSprite({kind:2-r,col:COLS[r]},titleForm.x+q*CW+CW/2,H*0.62+r*CH,Math.floor(now/450)%2);
    drawShip(W/2,SHIP_Y,1);drawShields()}
  else{
    drawShields();
    for(var i=0;i<aliens.length;i++){var a=aliens[i];if(!a.alive)continue;var p=a.dive?a:slot(a);drawSprite(a,p.x,p.y,a.dive?Math.floor(now/120)%2:form.anim)}
    if(saucer)drawSaucer(saucer);
    g.fillStyle="#fff";for(var s=0;s<shots.length;s++)g.fillRect(shots[s].x-1.5*K,shots[s].y-8*K,3*K,14*K);
    g.fillStyle="#ff8c42";for(var b=0;b<bombs.length;b++){var bm=bombs[b];g.fillRect(bm.x-2*K+Math.sin(bm.wob)*2*K,bm.y-6*K,4*K,10*K)}
    if(ship.alive&&(now>=ship.safeUntil||Math.floor(now/120)%2===0))drawShip(ship.x,SHIP_Y,1);
  }
  for(var pi=parts.length-1;pi>=0;pi--){var pt=parts[pi];if(!paused){pt.life-=dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt}if(pt.life<=0){parts.splice(pi,1);continue}
    g.globalAlpha=Math.max(0,pt.life/pt.max);g.fillStyle=pt.col;g.fillRect(pt.x,pt.y,pt.size,pt.size);g.globalAlpha=1}
  g.restore();
  if(state==="title")drawTitle(now);else drawHud();
  if(state!=="title"&&now-waveText<1600)g.save(),g.globalAlpha=Math.min(1,(1600-(now-waveText))/400),text("WAVE "+stats.wave,W/2,H*0.4,Math.max(20,40*K),"#48f0c8","center"),g.restore();
  if(now-beatAt<1400){g.save();g.globalAlpha=Math.min(1,(1400-(now-beatAt))/300);text("NEW BEST!",W/2,H*0.2,Math.max(20,40*K),"#ffd166","center");g.restore()}
  if(paused)text("PAUSED",W/2,H*0.45,Math.max(20,40*K),"#fff","center");
  if(state==="end"){drawEnd();if(now-endAt>=ENDMS){close();return}}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
</body></html>
