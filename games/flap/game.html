<!doctype html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:rgba(0,0,0,0);user-select:none;-webkit-user-select:none;cursor:pointer}
canvas{position:absolute;left:0;top:0;display:block}
</style></head><body>
<canvas id="c"></canvas>
<script>
// Flap: one key flaps a bird through the gaps between pillars. One point a
// gap; the gaps narrow and the pillars come quicker as the score climbs.
(function(){
var W=drip.width,H=drip.height,BEST=drip.best,sfx=drip.sfx;
var cv=document.getElementById("c"),c=cv.getContext("2d");cv.width=W;cv.height=H;
// The play area: a tall panel in the middle of the window, everything sized from its height.
var PH=Math.floor(H*0.94),PW=Math.floor(Math.min(W*0.8,PH*0.8)),PX=Math.floor((W-PW)/2),PY=Math.floor((H-PH)/2),U=PH/600;
var GROUND=PY+PH-Math.round(54*U),BX=PX+PW*0.3,BR=16*U;
var G=1700*U,FLAP=-470*U,SPEED0=165*U,SPEED1=265*U,GAP0=PH*0.31,GAP1=PH*0.17,PIPEW=56*U,SPACE0=PW*0.6,ENDMS=2400;
var state="title",bird,pipes,score,dead,deadAt,endAt,paused,shake,parts,scroll,beat,beatAt=-1e9,closed=false,wing=0,bob=0;
var stars=[],sky1=[],sky2=[];
for(var i=0;i<60;i++)stars.push({x:Math.random(),y:Math.random()*0.5,r:Math.random()*1.4*U+0.4,p:Math.random()*6});
function skyline(list,n,hi){for(var i=0;i<n;i++)list.push({w:0.03+Math.random()*0.07,h:hi*(0.4+Math.random()*0.6),win:Math.random()<0.7})}
skyline(sky1,34,PH*0.22);skyline(sky2,26,PH*0.34);
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function rnd(a,b){return a+Math.random()*(b-a)}
function kOf(s){return 1-Math.exp(-s/22)}
function reset(){bird={y:PY+PH*0.45,vy:0,rot:0};pipes=[];score=0;dead=false;paused=false;shake=0;parts=[];scroll=0;beat=false}
reset();window.__flap={state:function(){return state},bird:function(){return bird},pipes:function(){return pipes},score:function(){return score},x:BX,ground:GROUND,flap:flap};
function burst(x,y,n,cols,speed){for(var i=0;i<n;i++){var a=rnd(0,Math.PI*2),v=rnd(0.3,1)*speed;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-speed*0.4,life:rnd(0.5,1.1),max:1.1,s:rnd(3,7)*U,col:cols[i%cols.length]})}}
function flap(){if(state==="title"){state="play";last=performance.now()}
  if(state!=="play"||paused||dead)return;bird.vy=FLAP;wing=1;sfx.tone(560,0.07,"square",0.05,900)}
function die(){if(dead)return;dead=true;deadAt=performance.now();shake=9*U;bird.vy=Math.min(bird.vy,-120*U);
  burst(BX,bird.y,30,["#c084fc","#f472b6","#fff","#fde68a"],260*U);sfx.noise(0.5,0.5,1600,90);sfx.tone(300,0.5,"sawtooth",0.12,55)}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"||e.key==="m"||e.key==="M")return;
  if(e.key===" "||e.key==="ArrowUp"||e.key==="w"||e.key==="W"){e.preventDefault();if(!e.repeat)flap();return}
  if(e.repeat)return;
  if((e.key==="p"||e.key==="P")&&state==="play"&&!dead){paused=!paused;sfx.tone(paused?440:660,0.08,"triangle",0.06);return}
  if(state==="title")flap();
});
document.addEventListener("mousedown",function(e){e.preventDefault();flap()});
function spawn(){var k=kOf(score),gap=GAP0+(GAP1-GAP0)*k,top=PY+gap/2+34*U,bot=GROUND-gap/2-34*U,prev=pipes.length?pipes[pipes.length-1].cy:(top+bot)/2;
  var cy=Math.max(top,Math.min(bot,prev+rnd(-PH*0.36,PH*0.36)));pipes.push({x:PX+PW+PIPEW,cy:cy,gap:gap,passed:false,hue:(score*17)%360})}
function hitRect(x,y,r,rx,ry,rw,rh){var cx=Math.max(rx,Math.min(x,rx+rw)),cy=Math.max(ry,Math.min(y,ry+rh));var dx=x-cx,dy=y-cy;return dx*dx+dy*dy<r*r}
function physics(dt){bird.vy+=G*dt;bird.y+=bird.vy*dt;
  var target=Math.max(-0.5,Math.min(1.35,bird.vy/(600*U)));bird.rot+=(target-bird.rot)*Math.min(1,dt*9);
  if(bird.y-BR<PY){bird.y=PY+BR;bird.vy=0}
  if(bird.y+BR>GROUND){bird.y=GROUND-BR;bird.vy=0;if(!dead)die();else return true}return false}
function update(dt,now){
  if(state==="title"){bob+=dt;bird.y=PY+PH*0.45+Math.sin(bob*3)*7*U;bird.rot=Math.sin(bob*3)*0.15;scroll+=SPEED0*dt;wing=(wing+dt*2)%1;return}
  if(paused)return;
  wing=Math.max(0,wing-dt*5);
  if(!dead){var k=kOf(score),sp=SPEED0+(SPEED1-SPEED0)*k,space=SPACE0*(1-0.3*k);scroll+=sp*dt;
    for(var i=0;i<pipes.length;i++)pipes[i].x-=sp*dt;
    while(pipes.length&&pipes[0].x+PIPEW<PX-10)pipes.shift();
    if(!pipes.length||pipes[pipes.length-1].x<PX+PW+PIPEW-space)spawn();
    physics(dt);
    var r=BR*0.82;
    for(i=0;i<pipes.length;i++){var p=pipes[i];
      if(hitRect(BX,bird.y,r,p.x,PY-10,PIPEW,p.cy-p.gap/2-PY+10)||hitRect(BX,bird.y,r,p.x,p.cy+p.gap/2,PIPEW,GROUND-p.cy-p.gap/2+10)){die();break}
      if(!p.passed&&p.x+PIPEW<BX){p.passed=true;score++;drip.score(score);sfx.notes([[880,0.06,0],[1320,0.1,0.06]],"triangle",0.07);
        burst(BX+BR,bird.y,6,["#fde68a","#fff"],120*U);
        if(BEST>0&&!beat&&score>BEST){beat=true;beatAt=now;sfx.notes([[784,0.08,0],[988,0.08,0.08],[1319,0.24,0.16]],"triangle",0.1)}}}
  } else {physics(dt);if(state==="play"&&now-deadAt>900){state="end";endAt=now;drip.score(score);
      if(beat)sfx.notes([[523,0.12,0],[659,0.12,0.12],[784,0.12,0.24],[1047,0.35,0.36]]);else sfx.notes([[392,0.2,0],[330,0.2,0.2],[262,0.45,0.4]],"triangle",0.14)}}
  for(i=parts.length-1;i>=0;i--){var q=parts[i];q.life-=dt;q.vy+=900*U*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.life<=0)parts.splice(i,1)}
}
function text(str,x,y,size,col,align,weight){c.font=(weight||800)+" "+Math.round(size)+"px 'Avenir Next', 'Helvetica Neue', system-ui, sans-serif";c.textAlign=align||"center";c.textBaseline="middle";
  c.lineWidth=Math.max(2,size*0.14);c.strokeStyle="rgba(20,8,40,0.85)";c.lineJoin="round";c.strokeText(str,x,y);c.fillStyle=col;c.fillText(str,x,y)}
function roundRect(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawSky(now){var g=c.createLinearGradient(0,PY,0,GROUND);g.addColorStop(0,"#120a2e");g.addColorStop(0.55,"#3b1570");g.addColorStop(1,"#c2418f");c.fillStyle=g;c.fillRect(PX,PY,PW,PH);
  for(var i=0;i<stars.length;i++){var s=stars[i],a=0.5+0.5*Math.sin(now/600+s.p);c.globalAlpha=a*0.9;c.fillStyle="#fff";c.fillRect(PX+s.x*PW,PY+s.y*PH,s.r,s.r)}c.globalAlpha=1;
  // a moon
  c.fillStyle="#fde68a";c.beginPath();c.arc(PX+PW*0.78,PY+PH*0.14,PH*0.045,0,Math.PI*2);c.fill();c.fillStyle="#3b1570";c.beginPath();c.arc(PX+PW*0.78+PH*0.018,PY+PH*0.14-PH*0.012,PH*0.04,0,Math.PI*2);c.fill();
  layer(sky2,0.25,"rgba(40,12,70,0.9)",now);layer(sky1,0.5,"rgba(18,6,36,0.95)",now)}
function layer(list,par,col,now){var x=-((scroll*par)%(PW*1.4));c.fillStyle=col;
  for(var pass=0;pass<2;pass++){var cx=PX+x+pass*PW*1.4;for(var i=0;i<list.length;i++){var b=list[i],bw=b.w*PW,bh=b.h;if(cx+bw>PX&&cx<PX+PW){c.fillStyle=col;c.fillRect(cx,GROUND-bh,bw,bh);
      if(b.win){c.fillStyle="rgba(253,230,138,0.35)";for(var yy=GROUND-bh+6*U;yy<GROUND-8*U;yy+=10*U)for(var xx=cx+4*U;xx<cx+bw-6*U;xx+=9*U)if(((i*7+Math.floor(yy)+Math.floor(xx))%5)<2)c.fillRect(xx,yy,3*U,4*U)}}cx+=bw*1.1}}}
function drawGround(){c.fillStyle="#1a0b2e";c.fillRect(PX,GROUND,PW,PY+PH-GROUND);c.fillStyle="#7c3aed";c.fillRect(PX,GROUND,PW,5*U);
  var step=34*U,x=-(scroll%step);c.fillStyle="#a855f7";for(var i=x;i<PW;i+=step)c.fillRect(PX+Math.max(0,i),GROUND+9*U,Math.min(step*0.5,PW-i),4*U)}
function drawPipes(){for(var i=0;i<pipes.length;i++){var p=pipes[i],x0=Math.max(PX,p.x),x1=Math.min(PX+PW,p.x+PIPEW);if(x1<=x0)continue;
    pillar(p.x,PY,p.cy-p.gap/2,true);pillar(p.x,p.cy+p.gap/2,GROUND,false)}}
function pillar(x,y0,y1,top){var w=PIPEW,g=c.createLinearGradient(x,0,x+w,0);g.addColorStop(0,"#0d9488");g.addColorStop(0.35,"#2dd4bf");g.addColorStop(1,"#0f766e");
  c.save();c.beginPath();c.rect(PX,PY,PW,PH);c.clip();c.fillStyle=g;c.fillRect(x,y0,w,y1-y0);
  var ch=16*U,cy=top?y1-ch:y0;c.fillStyle="#14b8a6";c.fillRect(x-5*U,cy,w+10*U,ch);c.fillStyle="#5eead4";c.fillRect(x-5*U,cy+(top?0:ch-3*U),w+10*U,3*U);
  c.fillStyle="rgba(0,0,0,0.25)";c.fillRect(x-5*U,cy,w+10*U,2*U);c.restore()}
function drawBird(){c.save();c.translate(BX,bird.y);c.rotate(bird.rot);
  c.fillStyle="#a855f7";c.beginPath();c.arc(0,0,BR,0,Math.PI*2);c.fill();
  c.fillStyle="#f472b6";c.beginPath();c.arc(-BR*0.15,BR*0.3,BR*0.6,0,Math.PI*2);c.fill();
  var wa=wing>0?-0.9*Math.sin(wing*Math.PI):0.25;c.save();c.translate(-BR*0.2,0);c.rotate(wa);c.fillStyle="#e9d5ff";c.beginPath();c.ellipse(-BR*0.3,0,BR*0.75,BR*0.4,0,0,Math.PI*2);c.fill();c.restore();
  c.fillStyle="#fff";c.beginPath();c.arc(BR*0.42,-BR*0.3,BR*0.36,0,Math.PI*2);c.fill();c.fillStyle="#1a0b2e";c.beginPath();c.arc(BR*0.52,-BR*0.3,BR*0.17,0,Math.PI*2);c.fill();
  c.fillStyle="#fb923c";c.beginPath();c.moveTo(BR*0.7,BR*0.05);c.lineTo(BR*1.35,BR*0.2);c.lineTo(BR*0.7,BR*0.45);c.closePath();c.fill();
  c.lineWidth=Math.max(1,BR*0.12);c.strokeStyle="#2e1065";c.beginPath();c.arc(0,0,BR,0,Math.PI*2);c.stroke();c.restore()}
function drawParts(){for(var i=0;i<parts.length;i++){var p=parts[i];c.globalAlpha=Math.max(0,p.life/p.max);c.fillStyle=p.col;c.fillRect(p.x,p.y,p.s,p.s)}c.globalAlpha=1}
function drawHud(now){var s=Math.max(13,18*U);
  text(fmt(score),PX+PW/2,PY+PH*0.1,s*2.6,"#fff");
  text("BEST "+fmt(Math.max(BEST,score)),PX+PW-12*U,PY+14*U,s*0.8,"#fde68a","right");
  text("P PAUSE  M MUTE  ESC QUIT",PX+PW-12*U,PY+14*U+s*1.1,s*0.6,"rgba(255,255,255,0.75)","right",700);
  if(now-beatAt<1400){c.globalAlpha=Math.min(1,(1400-(now-beatAt))/300);text("NEW BEST!",PX+PW/2,PY+PH*0.2,s*1.6,"#fde68a");c.globalAlpha=1}
  if(paused)text("PAUSED",PX+PW/2,PY+PH*0.42,s*2.2,"#fff")}
function drawTitle(now){var s=Math.max(14,20*U),y=PY+PH*0.18;
  c.fillStyle="rgba(10,4,24,0.55)";c.fillRect(PX,PY,PW,PH);
  text("FLAP",PX+PW/2,y,s*3.4,"#f472b6");
  text("SPACE, UP OR CLICK TO FLAP",PX+PW/2,y+s*3.1,s*0.85,"#fff");
  text("BEST "+fmt(BEST),PX+PW/2,y+s*4.5,s*1.1,"#fde68a");
  c.globalAlpha=0.6+0.4*Math.sin(now/300);text("PRESS ANY KEY",PX+PW/2,PY+PH*0.78,s*0.9,"#fff");c.globalAlpha=1;drawBird()}
function drawEnd(now){var k=Math.min(1,(now-endAt)/250),s=Math.max(14,20*U),bw=PW*0.82,bh=s*8,bx=PX+PW/2-bw/2,by=PY+PH*0.36-bh/2;
  c.save();c.globalAlpha=k;c.fillStyle="rgba(12,5,30,0.93)";roundRect(bx,by,bw,bh,12*U);c.fill();c.strokeStyle="#f472b6";c.lineWidth=Math.max(2,3*U);c.stroke();
  text("GAME OVER",PX+PW/2,by+s*1.8,s*1.6,"#f472b6");text(fmt(score),PX+PW/2,by+s*4.2,s*2.4,"#fff");
  text(beat?"NEW BEST!":"BEST "+fmt(Math.max(BEST,score)),PX+PW/2,by+s*6.4,s*0.9,"#fde68a");c.restore()}
var last=performance.now();
function frame(now){if(closed)return;var dt=Math.min(0.04,(now-last)/1000);last=now;
  update(dt,now);
  c.clearRect(0,0,W,H);c.save();roundRect(PX,PY,PW,PH,14*U);c.clip();
  if(shake>0){c.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);shake=Math.max(0,shake-dt*30*U)}
  drawSky(now);drawPipes();drawGround();drawParts();drawBird();c.restore();
  c.strokeStyle="rgba(255,255,255,0.25)";c.lineWidth=2;roundRect(PX+1,PY+1,PW-2,PH-2,14*U);c.stroke();
  if(state==="title")drawTitle(now);else drawHud(now);
  if(state==="end"){drawEnd(now);if(now-endAt>=ENDMS){closed=true;c.clearRect(0,0,W,H);drip.end();return}}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
</body></html>
