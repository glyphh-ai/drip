<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drips</title>
<link rel="stylesheet" href="/page.css">
<script>window.DRIPS_TOKEN = "__DRIPS_TOKEN__"</script>
</head>
<body>
<main id="app">
  <header id="head">
    <h2>Drips</h2>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Search drips" spellcheck="false" autocomplete="off">
    </label>
    <div id="licence"></div>
    <button id="add" class="btn primary" type="button">+ Add</button>
  </header>

  <div id="toolbar">
    <button class="tab on" type="button">Your drips</button>
    <span class="spacer"></span>
    <span id="where" class="muted"></span>
    <span id="count" class="muted"></span>
  </div>
  <div id="list"></div>

  <section id="editor" class="hidden">
    <div class="editor-head">
      <button id="back" class="back" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Drips</button>
      <span class="spacer"></span>
      <button id="play" class="btn primary" type="button" title="Play this drip">&#9654; Play</button>
      <button id="stop" class="btn" type="button" title="Stop every effect that is playing">&#9632; Stop</button>
    </div>
    <div id="error" class="error hidden"></div>
    <div id="detail" class="detail"></div>

    <label class="label" for="name">Name</label>
    <input id="name" class="field" type="text" placeholder="preset name" spellcheck="false" autocomplete="off">

    <label class="label" for="mode">Mode</label>
    <div class="inline">
      <select id="mode" class="field auto">
        <option value="oneshot">One-shot</option>
        <option value="counted">Counted</option>
        <option value="persistent">Persistent (toggle on/off)</option>
      </select>
      <input id="count-input" class="field small hidden" type="number" min="2" max="10" value="3" aria-label="Count">
    </div>

    <label class="label">Effects</label>
    <div id="effects"></div>
    <button id="add-effect" class="btn" type="button">+ Add effect</button>

    <label class="label">Recipe preview</label>
    <code id="preview" class="preview">&mdash;</code>

    <div class="actions">
      <button id="delete" class="btn danger" type="button">Delete</button>
      <span class="spacer"></span>
      <button id="cancel" class="btn" type="button">Cancel</button>
      <button id="save" class="btn primary" type="button">Save</button>
    </div>
  </section>
</main>

<div id="locked" class="hidden"></div>

<div id="confirm" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="dialog">
    <h3 id="confirm-title"></h3>
    <p>The drip disappears from your library.</p>
    <div class="actions">
      <span class="spacer"></span>
      <button id="confirm-no" class="btn" type="button">Cancel</button>
      <button id="confirm-yes" class="btn danger-solid" type="button">Delete drip</button>
    </div>
  </div>
</div>

<script type="module" src="/page.js"></script>
</body>
</html>
